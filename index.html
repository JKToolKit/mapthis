<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map This – UK Postcode Mapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #map { height: 600px; border: 1px solid #ccc; margin-top: 20px; }
    input[type="file"] { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Map This</h1>
  <div style="background:#e8f5e9;border-left:6px solid #4caf50;padding:10px;">
    <strong>Privacy Notice:</strong> Files are read only in your browser – nothing is uploaded.
  </div>

  <p>Select a spreadsheet (CSV, XLSX, ODS, etc.).</p>
  <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.ods" />
  <div id="map">Loading map...</div>

  <!-- Core libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.2/papaparse.min.js"></script>

  <!-- Postcode JS parts -->
  <script src="postcodeDB_part1.js"></script>
  <script src="postcodeDB_part2.js"></script>
  <script src="postcodeDB_part3.js"></script>

  <script>
    window.onload = () => {
      const postcodeDB = {
        ...postcodeDB_part1,
        ...postcodeDB_part2,
        ...postcodeDB_part3
      };

      const map = L.map('map').setView([54.5, -3.5], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const ext = file.name.split('.').pop().toLowerCase();

        reader.onload = (event) => {
          let data;
          if (ext === 'csv') {
            data = Papa.parse(event.target.result, { header: true }).data;
          } else {
            const wb = XLSX.read(event.target.result, { type: 'binary' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            data = XLSX.utils.sheet_to_json(sheet);
          }
          plotData(data);
        };

        if (ext === 'csv') reader.readAsText(file);
        else reader.readAsBinaryString(file);
      });

      function plotData(rows) {
        let plotted = 0;
        rows.forEach(row => {
          const raw = (row.Postcode || row.postcode || '').replace(/\s/g, '').toUpperCase();
          const name = row.Operator || row.Name || "Unknown";
          if (postcodeDB[raw]) {
            const [lat, lng] = postcodeDB[raw];
            L.marker([lat, lng]).addTo(map).bindPopup(`<b>${name}</b><br>${raw}`);
            plotted++;
          } else if (raw) {
            console.warn("Postcode not found:", raw);
          }
        });

        if (plotted === 0) {
          alert("No valid UK postcodes were found.");
        } else {
          console.log("Plotted", plotted, "markers.");
        }
      }
    };
  </script>
</body>
</html>
